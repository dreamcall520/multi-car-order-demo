<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>独立站多车合并下单｜CRM 原型总览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1120px; color: #1f2937; background: #f5f7fa; font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { height: 64px; display: flex; align-items: center; padding: 0 28px; color: #fff; background: #1f3b64; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .sub { margin-left: 14px; color: #b9c8dd; }
    .end-switch { display: flex; gap: 8px; margin-left: auto; }
    button { border: 0; cursor: pointer; font: inherit; }
    .end-switch button { min-width: 78px; padding: 8px 14px; border: 1px solid #61799a; border-radius: 4px; color: #dce7f5; background: transparent; }
    .end-switch button.active { border-color: #fff; color: #1f3b64; background: #fff; font-weight: 600; }
    .layout { display: flex; height: calc(100vh - 64px); min-height: 700px; }
    aside { width: 220px; padding: 20px 12px; border-right: 1px solid #e3e8ef; background: #fff; }
    .aside-title { padding: 0 12px 12px; color: #8793a6; font-size: 12px; }
    .view-list { display: grid; gap: 5px; }
    .view-list button { padding: 11px 12px; border-radius: 4px; text-align: left; color: #465266; background: #fff; }
    .view-list button:hover { background: #f2f6fc; }
    .view-list button.active { color: #1677ff; background: #eaf3ff; font-weight: 600; }
    main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .crumb { height: 50px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #e3e8ef; color: #667085; background: #fff; }
    .crumb b { color: #27364d; }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>独立站多车合并下单</h1><span class="sub">CRM 原型总览</span>
    <div class="end-switch" aria-label="终端切换">
      <button class="active" data-end="pc">PC 端</button>
      <button data-end="mobile">移动端</button>
    </div>
  </header>
  <div class="layout">
    <aside><div class="aside-title" id="asideTitle">PC 页面</div><div class="view-list" id="viewList"></div></aside>
    <main><div class="crumb" id="crumb"></div><iframe id="frame" title="CRM 原型预览"></iframe></main>
  </div>
  <script>
    const views = {
      pc: [
        ['purchase', '采购清单', 'https://global-image-pub.guazistatic-global.com/qnbdp8307xa3fe207467824d4bbdcfb6eef11a9e7b1786588401.html'],
        ['orderList', '订单列表', 'https://global-image-pub.guazistatic-global.com/qnbdp8307x82564a6169fd4aac9b4576a1af6414dc1786546460.html'],
        ['master', '合单主订单详情', 'https://global-image-pub.guazistatic-global.com/qnbdp8307xc7f9b3c2d8ae4c539e1b7b1cb389e9111786543778.html'],
        ['child', '子订单详情', 'https://global-image-pub.guazistatic-global.com/qnbdp8307x116053cb92bb461fa3067b96e94d99f51786533771.html'],
        ['contract', '外销合同', 'https://global-image-pub.guazistatic-global.com/qnbdp8307x3a12d9e02e374285ad75eec190b47dad1786586866.html']
      ],
      mobile: [
        ['mobileCustomer', '客户采购清单与客户订单', 'https://global-image-pub.guazistatic-global.com/qnbdp8307x7dd4886872f149fa9caa3bd9efbcaa871786545590.html']
      ]
    };
    let currentEnd = 'pc';
    let currentView = 'purchase';
    const frame = document.getElementById('frame');
    const list = document.getElementById('viewList');
    function render() {
      const items = views[currentEnd];
      if (!items.some(item => item[0] === currentView)) currentView = items[0][0];
      document.getElementById('asideTitle').textContent = currentEnd === 'pc' ? 'PC 页面' : '移动端页面';
      list.innerHTML = items.map(([id, name]) => `<button class="${id === currentView ? 'active' : ''}" data-view="${id}">${name}</button>`).join('');
      const view = items.find(item => item[0] === currentView);
      document.getElementById('crumb').innerHTML = `CRM 原型总览&nbsp;&nbsp;/&nbsp;&nbsp;<b>${currentEnd === 'pc' ? 'PC 端' : '移动端'}&nbsp;&nbsp;/&nbsp;&nbsp;${view[1]}</b>`;
      frame.src = view[2];
      location.hash = `${currentEnd}/${currentView}`;
    }
    document.querySelector('.end-switch').addEventListener('click', event => {
      const button = event.target.closest('button[data-end]'); if (!button) return;
      currentEnd = button.dataset.end;
      document.querySelectorAll('[data-end]').forEach(item => item.classList.toggle('active', item === button));
      render();
    });
    list.addEventListener('click', event => { const button = event.target.closest('[data-view]'); if (button) { currentView = button.dataset.view; render(); } });
    const parts = location.hash.replace('#', '').split('/');
    if (views[parts[0]]) { currentEnd = parts[0]; currentView = parts[1] || views[currentEnd][0][0]; document.querySelectorAll('[data-end]').forEach(item => item.classList.toggle('active', item.dataset.end === currentEnd)); }
    render();
  </script>
</body>
</html>
